<div class="p-6 bg-gray-100 min-h-screen">

  <h2 class="text-3xl font-bold mb-6 text-gray-800">Administrar Tallas</h2>

  <div class="mb-6 rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-5">
    <div class="mb-4">
      <input
        type="text"
        placeholder="Buscar por nombre o abreviatura..."
        class="w-full rounded-md border px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="busqueda"
        (input)="filtrarTallas()"
      />
    </div>

    <!-- mobile-only: indicador visual de que la tabla se puede deslizar horizontalmente -->
    <div class="border-b border-blue-100 bg-gradient-to-r from-blue-50 via-white to-blue-50 px-3 py-2 text-center text-[10px] font-semibold uppercase tracking-[0.2em] text-blue-600 md:hidden">
      ← Desliza para ver más →
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-[700px] table-auto text-left text-sm md:min-w-full">
        <thead class="bg-gray-200">
          <tr>
            <th class="px-4 py-2">ID</th>
            <th class="px-4 py-2">Nombre de la Talla</th>
            <th class="px-4 py-2">Abreviatura</th>
            <th class="px-4 py-2 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tallasFiltradas" class="border-b hover:bg-gray-50">
            <td class="px-4 py-2">{{ t.idTalla }}</td>
            <td class="px-4 py-2">{{ t.nombreTalla }}</td>
            <td class="px-4 py-2">{{ t.abreviatura }}</td>
            <td class="px-4 py-2 text-center">
              <div class="flex flex-col gap-2 sm:flex-row sm:justify-center">
                <button (click)="editarTalla(t)" class="rounded-md bg-blue-500 px-3 py-1 text-xs text-white hover:bg-blue-600 transition-colors">
                  Editar
                </button>
                <button (click)="eliminarTalla(t.idTalla!)" class="rounded-md bg-red-500 px-3 py-1 text-xs text-white hover:bg-red-600 transition-colors">
                  Eliminar
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-5">
    <h3 class="mb-4 text-xl font-semibold text-gray-700">{{ tallaEnEdicion != null ? 'Actualizar Talla' : 'Agregar Nueva Talla' }}</h3>

    <!-- mobile-first: 1 columna en móvil y 2 columnas en pantallas mayores -->
    <form [formGroup]="tallaForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div class="sm:col-span-2">
        <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre de la Talla</label>
        <input type="text" id="nombre" name="nombre"
        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
        formControlName="NombreTalla">
      </div>

      <div class="sm:col-span-2">
        <label for="abreviatura" class="block text-sm font-medium text-gray-700">Abreviatura</label>
        <input type="text" id="abreviatura" name="abreviatura"
        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
        formControlName="Abreviatura">
      </div>

      <div class="sm:col-span-2 flex flex-col gap-3 sm:flex-row sm:justify-end">
        <button type="submit" class="w-full rounded-md bg-green-600 px-4 py-2 text-white shadow-sm transition-colors hover:bg-green-700 sm:w-auto">
          Guardar Talla
        </button>
        <button (click)="cancelarEdicion()" type="button" class="w-full rounded-md bg-gray-400 px-4 py-2 text-white shadow-sm transition-colors hover:bg-gray-500 sm:w-auto">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
