<div class="p-6 bg-gray-100 min-h-screen">

  <h2 class="text-3xl font-bold mb-6 text-gray-800">Administrar Colores</h2>

  <div class="mb-6 rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-5">
    <!-- mobile-only: indicador visual de que la tabla se puede deslizar horizontalmente -->
    <div class="border-b border-blue-100 bg-gradient-to-r from-blue-50 via-white to-blue-50 px-3 py-2 text-center text-[10px] font-semibold uppercase tracking-[0.2em] text-blue-600 md:hidden">
      ← Desliza para ver más →
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-[700px] table-auto text-left text-sm md:min-w-full">
        <thead class="bg-gray-200">
          <tr>
            <th class="px-4 py-2">ID</th>
            <th class="px-4 py-2">Nombre del Color</th>
            <th class="px-4 py-2">Abreviatura</th>
            <th class="px-4 py-2 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of colores" class="border-b hover:bg-gray-50">
            <td class="px-4 py-2">{{ c.idColor }}</td>
            <td class="px-4 py-2">{{ c.nombreColor }}</td>
            <td class="px-4 py-2">{{ c.abreviatura }}</td>
            <td class="px-4 py-2 text-center">
              <div class="flex flex-col gap-2 sm:flex-row sm:justify-center">
                <button
                  (click)="editar(c)"
                  class="rounded-md bg-blue-500 px-3 py-1 text-xs text-white transition-colors hover:bg-blue-600">
                  Editar
                </button>
                <button
                  (click)="eliminar(c.idColor!)"
                  class="rounded-md bg-red-500 px-3 py-1 text-xs text-white transition-colors hover:bg-red-600">
                  Eliminar
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-5">
    <h3 class="text-xl font-semibold mb-4 text-gray-700">
      {{ editando ? 'Editar Color' : 'Agregar Nuevo Color' }}
    </h3>

    <!-- mobile-first: 1 columna en móvil y 2 columnas en pantallas mayores -->
    <form [formGroup]="formColor" (ngSubmit)="guardarColor()" class="grid grid-cols-1 gap-4 sm:grid-cols-2">

      <div class="sm:col-span-2">
        <label for="nombreColor" class="block text-sm font-medium text-gray-700">Nombre del Color</label>
        <input
          type="text"
          id="nombreColor"
          formControlName="nombreColor"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <div *ngIf="formColor.get('nombreColor')?.invalid && formColor.get('nombreColor')?.touched" class="text-red-500 text-xs mt-1">
            El nombre es obligatorio.
          </div>
      </div>

      <div class="sm:col-span-2">
        <label for="abreviatura" class="block text-sm font-medium text-gray-700">Abreviatura</label>
        <input
          type="text"
          id="abreviatura"
          formControlName="abreviatura"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>

      <div class="sm:col-span-2 flex flex-col gap-3 pt-2 sm:flex-row sm:justify-end">
        <button
          type="submit"
          class="w-full rounded-md bg-green-600 px-4 py-2 text-white shadow-sm transition-colors hover:bg-green-700 sm:w-auto">
          {{ editando ? 'Actualizar Color' : 'Guardar Color' }}
        </button>

        <button
          *ngIf="editando"
          (click)="cancelarEdicion()"
          type="button"
          class="w-full rounded-md bg-gray-400 px-4 py-2 text-white shadow-sm transition-colors hover:bg-gray-500 sm:w-auto">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
