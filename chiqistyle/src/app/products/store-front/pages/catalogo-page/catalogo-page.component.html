<div class="min-h-screen bg-gradient-to-br from-pink-50 via-white to-rose-50 text-slate-800">
  <!-- flex + justify-between = alinea el logo y el botón del carrito en la misma fila. -->
  <header class="sticky top-0 z-20 border-b border-pink-100 bg-white/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-pink-500 text-lg font-black text-white shadow-sm">
          C
        </div>
        <div>
          <p class="text-xl font-black tracking-tight text-pink-600">Chiqistyle</p>
        </div>
      </div>

      <button class="btn btn-circle border-pink-200 bg-pink-50 text-pink-600 hover:bg-pink-100 hover:border-pink-300" aria-label="Carrito de compras">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h2.25l1.6 8.25A2.25 2.25 0 0 0 8.34 13.5h8.91a2.25 2.25 0 0 0 2.21-1.69L20.7 6H6.09M9 19.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm9 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- mx-auto max-w-7xl = centra el contenido con un ancho máximo y margen lateral. -->
  <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <!-- flex + justify-between = coloca el título y el contador de productos en una misma línea. -->
    <div class="mb-8 flex items-end justify-between gap-3">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.25em] text-pink-500">Colección</p>
        <h1 class="mt-2 text-3xl font-black text-slate-800 sm:text-4xl">Catálogo</h1>
      </div>

      <span class="badge badge-soft bg-pink-100 text-pink-700 border-pink-200 px-3 py-3 text-sm font-medium">
        {{ productos.length }} productos
      </span>
    </div>

    <!-- grid gap-6 sm:grid-cols-2 xl:grid-cols-4 = organiza los productos en 2 columnas en móvil y hasta 4 en desktop. -->
    <section class="grid gap-6 sm:grid-cols-2 xl:grid-cols-4">
      <!-- rounded-3xl + shadow + hover:-translate-y-1 = da formato a cada tarjeta y le agrega elevación al pasar el mouse. -->
      <article *ngFor="let producto of productos" class="group overflow-hidden rounded-3xl border border-pink-100 bg-white shadow-[0_10px_30px_rgba(236,72,153,0.08)] transition duration-300 hover:-translate-y-1 hover:shadow-[0_16px_35px_rgba(236,72,153,0.14)]">
        <div class="relative overflow-hidden">
          <img
            [src]="producto.fotoProducto"
            [alt]="producto.nombreProducto"
            class="h-72 w-full object-cover transition duration-500 group-hover:scale-105"
          />

          <span *ngIf="producto.esLiquidacion" class="absolute left-3 top-3 badge border-0 bg-pink-600 text-white shadow-md">
            {{ producto.etiqueta || 'Liquidación' }}
          </span>
        </div>

        <div class="space-y-4 p-4">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-pink-500">
              {{ producto.categoria }}
            </p>
            <h2 class="mt-2 text-lg font-bold text-slate-800">
              {{ producto.nombreProducto }}
            </h2>
          </div>

          <div class="flex items-center gap-2">
            <span class="text-xl font-black text-pink-600">${{ producto.precio | number:'1.0-0' }}</span>
            <span *ngIf="producto.precioOriginal" class="text-sm text-slate-400 line-through">
              ${{ producto.precioOriginal | number:'1.0-0' }}
            </span>
          </div>

          <p class="text-sm text-slate-500">
            {{ producto.descripcion }}
          </p>

          <!-- flex gap-2 = coloca los botones uno al lado del otro con separación. -->
          <div class="flex gap-2 pt-1">
            <button class="btn flex-1 border-pink-200 bg-white text-pink-600 hover:bg-pink-50 hover:border-pink-300">
              Ver más
            </button>
            <button class="btn flex-1 border-0 bg-pink-500 text-white hover:bg-pink-600">
              Agregar
            </button>
          </div>
        </div>
      </article>
    </section>
  </main>
</div>
