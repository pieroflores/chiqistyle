<div class="min-h-screen bg-gradient-to-br from-pink-50 via-white to-rose-50 text-slate-800">
  <!-- header = mantiene la identidad visual de la tienda con la misma paleta rosa/fucsia. -->
  <header class="sticky top-0 z-20 border-b border-pink-100 bg-white/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <button
        type="button"
        (click)="volverAlCatalogo()"
        class="inline-flex items-center gap-2 rounded-full border border-pink-200 bg-white px-3 py-2 text-sm font-semibold text-pink-600 shadow-sm transition hover:bg-pink-50"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Volver
      </button>

      <div class="flex items-center gap-3">
        <img src="/img/logochiqi.png" alt="Chiqistyle logo" class="h-11 w-11 rounded-xl object-cover shadow-sm ring-2 ring-pink-100" />
        <p class="text-xl font-black tracking-tight text-pink-600">Chiqistyle</p>
      </div>
    </div>
  </header>

  <main *ngIf="producto as p" class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8 lg:py-12">
    <!-- grid + gap-8 = en móvil se apila verticalmente; en desktop la imagen queda a la izquierda y la información a la derecha. -->
    <section class="grid gap-8 lg:grid-cols-2 lg:items-start">
      <div class="overflow-hidden rounded-[32px] border border-pink-100 bg-white p-3 shadow-sm sm:p-4">
        <img
          [src]="p.fotoProducto"
          [alt]="p.nombreProducto"
          class="h-[420px] w-full rounded-[24px] object-cover sm:h-[560px] lg:h-[680px]"
        />
      </div>

      <div class="space-y-6">
        <div class="space-y-3">
          <span class="inline-flex items-center rounded-full border border-pink-200 bg-pink-100 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.2em] text-pink-700">
            {{ p.categoria }}
          </span>

          <h1 class="text-3xl font-black tracking-tight text-slate-800 sm:text-4xl">
            {{ p.nombreProducto }}
          </h1>
        </div>

        <!-- flex + items-center + gap-3 = alinea precio actual y precio tachado con consistencia visual. -->
        <div class="flex items-center gap-3">
          <span class="text-3xl font-black text-pink-600">${{ p.precio | number:'1.0-0' }}</span>
          <span *ngIf="p.precioOriginal" class="text-lg text-slate-400 line-through">
            ${{ p.precioOriginal | number:'1.0-0' }}
          </span>
        </div>

        <div class="rounded-[24px] border border-pink-100 bg-white p-4 shadow-sm">
          <div class="mb-4 flex items-center justify-between gap-3">
            <p class="text-sm font-bold uppercase tracking-[0.16em] text-slate-600">Talla</p>
            <span class="text-xs font-medium text-pink-500">Selecciona una</span>
          </div>

          <div class="flex flex-wrap gap-2">
            <button
              *ngFor="let talla of p.tallas"
              type="button"
              (click)="tallaSeleccionada = talla"
              [class.border-pink-500]="tallaSeleccionada === talla"
              [class.bg-pink-500]="tallaSeleccionada === talla"
              [class.text-white]="tallaSeleccionada === talla"
              [class.text-pink-600]="tallaSeleccionada !== talla"
              [class.bg-pink-50]="tallaSeleccionada !== talla"
              class="min-w-[52px] rounded-full border px-3 py-2 text-sm font-bold transition hover:border-pink-400"
            >
              {{ talla }}
            </button>
          </div>
        </div>

        <div class="rounded-[24px] border border-pink-100 bg-white p-4 shadow-sm">
          <div class="mb-4 flex items-center justify-between gap-3">
            <p class="text-sm font-bold uppercase tracking-[0.16em] text-slate-600">Color</p>
            <span class="text-xs font-medium text-pink-500">{{ colorSeleccionado?.nombre || 'Elegido' }}</span>
          </div>

          <div class="flex flex-wrap gap-3">
            <button
              *ngFor="let color of p.colores"
              type="button"
              (click)="colorSeleccionado = color"
              [attr.aria-label]="color.nombre"
              [title]="color.nombre"
              [class.ring-2]="colorSeleccionado?.nombre === color.nombre"
              [class.ring-pink-300]="colorSeleccionado?.nombre === color.nombre"
              class="h-10 w-10 rounded-full border-2 border-white shadow-sm transition hover:scale-105"
              [style.background-color]="color.hex"
            ></button>
          </div>
        </div>

        <div class="rounded-[24px] border border-pink-100 bg-white p-4 shadow-sm">
          <p class="mb-3 text-sm font-bold uppercase tracking-[0.16em] text-slate-600">Cantidad</p>

          <div class="flex w-fit items-center overflow-hidden rounded-full border border-pink-200 bg-pink-50">
            <button
              type="button"
              (click)="disminuirCantidad()"
              class="flex h-11 w-11 items-center justify-center text-xl font-bold text-pink-600 transition hover:bg-pink-100"
            >
              −
            </button>
            <span class="min-w-[56px] text-center text-lg font-black text-slate-800">{{ cantidad }}</span>
            <button
              type="button"
              (click)="aumentarCantidad()"
              class="flex h-11 w-11 items-center justify-center text-xl font-bold text-pink-600 transition hover:bg-pink-100"
            >
              +
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="consultarPorWhatsApp()"
          class="w-full rounded-[20px] bg-pink-500 px-6 py-4 text-base font-extrabold text-white shadow-lg shadow-pink-200 transition hover:bg-pink-600"
        >
          Consultar por WhatsApp
        </button>

        <div class="rounded-[24px] border border-pink-100 bg-white p-4 shadow-sm">
          <p class="mb-2 text-sm font-bold uppercase tracking-[0.16em] text-slate-600">Descripción</p>
          <p class="text-base leading-7 text-slate-600">
            {{ p.descripcion }}
          </p>
        </div>
      </div>
    </section>
  </main>
</div>
